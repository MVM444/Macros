<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3242"/>
      <stop offset="100%" stop-color="#1b202b"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd180"/>
      <stop offset="100%" stop-color="#ff8a50"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="45%" stop-color="#ffb74d"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
    <linearGradient id="fireCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffde7"/>
      <stop offset="100%" stop-color="#ffcc80"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- llama animal body -->
  <ellipse cx="70" cy="78" rx="30" ry="19" fill="url(#fur)"/>
  <rect x="47" y="88" width="9" height="21" rx="4" fill="#ff9f67"/>
  <rect x="62" y="88" width="9" height="21" rx="4" fill="#ff9f67"/>
  <rect x="77" y="88" width="9" height="21" rx="4" fill="#ff9f67"/>
  <rect x="90" y="88" width="9" height="21" rx="4" fill="#ff9f67"/>

  <!-- neck and head -->
  <rect x="43" y="44" width="16" height="35" rx="8" fill="url(#fur)"/>
  <ellipse cx="48" cy="37" rx="13" ry="12" fill="url(#fur)"/>
  <path d="M40 30l4-14 7 10z" fill="#ffb074"/>
  <path d="M50 28l6-13 5 12z" fill="#ffb074"/>
  <circle cx="44" cy="37" r="2.2" fill="#4a2e1a"/>
  <path d="M47 42c2 2 5 2 7 0" fill="none" stroke="#4a2e1a" stroke-width="2" stroke-linecap="round"/>

  <!-- fire mane -->
  <path d="M57 58c2-10 8-14 11-23 1 5 3 8 7 11 1-6 6-12 11-15-2 8 2 11 4 16 3-3 7-6 11-7-3 7 0 12 2 18 2 8-1 14-8 18-6 4-17 5-25 2-10-4-15-12-13-20z" fill="url(#fire)"/>
  <path d="M69 58c1-5 5-8 7-12 1 3 2 4 4 6 1-3 3-6 6-8-1 4 1 6 2 8 2-1 4-3 6-3-2 4 0 6 1 9 1 4-1 7-4 9-4 2-9 3-13 1-6-2-10-6-9-10z" fill="url(#fireCore)" opacity="0.9"/>

  <!-- fire tail -->
  <path d="M99 70c6-7 6-14 4-21 5 4 8 9 8 16 0 8-5 15-12 20z" fill="url(#fire)"/>
  <path d="M101 72c3-4 4-8 3-13 3 3 4 6 4 10 0 5-3 8-7 11z" fill="url(#fireCore)" opacity="0.9"/>

  <ellipse cx="64" cy="112" rx="34" ry="4" fill="#0f1218" opacity="0.45"/>
